<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo Sync</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>Todo Sync</h1>
        <p>Lista sincronizada entre dispositivos en tiempo real.</p>
      </header>

      <form id="todo-form" class="todo-form">
        <input
          id="todo-input"
          name="todo"
          type="text"
          placeholder="Escribe una tarea..."
          maxlength="200"
          required
        />
        <button type="submit">Agregar</button>
      </form>

      <section class="status" id="status">Conectando...</section>
      <ul id="todo-list" class="todo-list"></ul>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
